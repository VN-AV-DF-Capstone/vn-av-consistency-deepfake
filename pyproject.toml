[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "vn-av-df-forensics"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "av>=12", "opencv-python>=4.8", "scipy>=1.11,<2", "imageio-ffmpeg==0.6.0", "PyYAML>=6", "fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
[project.optional-dependencies]
generation = ["torch>=2.6", "librosa>=0.10", "numba", "tqdm", "gdown>=5", "huggingface-hub>=0.34", "diffusers>=0.30", "safetensors>=0.5"]
training = ["torch>=2.6", "transformers>=5,<6", "safetensors>=0.5", "huggingface-hub>=0.34", "scikit-learn>=1.4", "matplotlib>=3.7"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src", "data_pipeline/src"]
testpaths = ["tests", "data_pipeline/tests"]
addopts = "-p no:cacheprovider"
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.ruff.lint.per-file-ignores]
"generation/*.py" = ["E402"]
"training/*.py" = ["E402"]
"src/vn_av_df/wav2lip_worker.py" = ["E402"]
