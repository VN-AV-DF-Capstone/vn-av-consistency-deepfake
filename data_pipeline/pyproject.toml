[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vn-av-data"
version = "2.0.0"
description = "Download, curate and export reviewed audio-visual datasets"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24,<3", "opencv-python>=4.8", "av>=12", "scipy>=1.11,<2",
  "imageio-ffmpeg==0.6.0", "PyYAML>=6", "onnxruntime>=1.20",
  "yt-dlp[default]>=2025.11", "fastapi>=0.115", "uvicorn>=0.30"
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8"]

[project.scripts]
vn-av-data = "vn_av_data.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vn_av_data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"steps/*.py" = ["E402"]
